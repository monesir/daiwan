<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الديوان الذكي</title>
    <style>
        body {
            width: 250px;
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f2824;
            color: #ebd197;
            text-align: center;
            border: 1px solid #3e3833;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .header img {
            width: 32px;
            height: 32px;
            margin-left: 10px;
            border-radius: 5px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        p {
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            margin-bottom: 20px;
        }
        a.btn {
            display: inline-block;
            background-color: #3e3833;
            color: #ebd197;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 13px;
            transition: all 0.2s ease;
            border: 1px solid #ebd197;
        }
        a.btn:hover {
            background-color: #ebd197;
            color: #2f2824;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon48.png" alt="شعار">
        <h2>الديوان - تصميم اقتباس</h2>
    </div>
    <p>إضافة مصممة للارتقاء بتجربة قراءة وتوثيق الشعر العربي.</p>
    <a href="https://github.com/monesir/daiwan" target="_blank" class="btn">رابط المشروع والمصدر</a>
</body>
</html>
